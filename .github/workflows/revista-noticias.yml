name: Bitácora · noticias

# Guardaba las noticias de cada eje para la revista quincenal. Desde octubre de 2026 la newsletter es semanal y
# solo del tiempo, así que ya no se ejecuta sola; queda a mano por si vuelven las noticias.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/revista_noticias.py
      - name: Publicar si ha cambiado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/revista/noticias.json
          git diff --cached --quiet && exit 0
          git commit -m "Bitácora: noticias $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
