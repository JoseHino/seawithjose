name: Parte del mar

# Previsión de AEMET (XML públicos, sin clave) y notas del 1 al 10 para navegar,
# bucear y pescar, cada tres horas de 7:15 a 22:15 (hora de verano en Marbella).
on:
  schedule:
    - cron: "15 5-20/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parte
  cancel-in-progress: false

jobs:
  parte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parte de AEMET
        run: python scripts/parte_mar.py
      - name: Publicar si ha cambiado
        run: |
          [ -f datos/mar.json ] || exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/mar.json
          git diff --cached --quiet && exit 0
          git commit -m "Parte del mar $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
